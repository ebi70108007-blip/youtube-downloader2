name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-flet-0.25.2
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install flet==0.25.2 certifi
          pip install --upgrade yt-dlp

      - name: Verify Python Syntax
        run: |
          python -m py_compile main.py

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Build APK without Prompts
        run: |
          python -c "import subprocess; subprocess.run(['flet', 'build', 'apk', '--include-packages', 'flet_webview'], input=b'y\n', check=True)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-downloader-apk
          path: build/apk/*.apk
